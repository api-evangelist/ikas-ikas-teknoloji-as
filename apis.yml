aid: ikas-ikas-teknoloji-as
name: Ikas, IKAS Teknoloji AS
description: >-
  ikas (IKAS Teknoloji AS) is an all-in-one e-commerce platform, headquartered
  in Turkey and backed by 500 Global, that lets merchants build online stores,
  manage products, inventory, orders, customers, and campaigns, and sell across
  multiple sales channels. For developers and partners, ikas exposes a public
  GraphQL Admin API at api.myikas.com that covers products, variants, orders,
  transactions, customers, price lists, campaigns, coupons, stock locations,
  sales channels, storefronts, and webhooks. Apps authenticate with OAuth 2.0
  (client_credentials for private/store apps and authorization_code for public
  admin apps) using scoped permissions such as read_products/write_products and
  read_orders/write_orders. ikas also ships a TypeScript SDK, an ikas CLI, an
  App Bridge for embedded dashboard apps, a theme development kit, and an
  official MCP server for its code components.
